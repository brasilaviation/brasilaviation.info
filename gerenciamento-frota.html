<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Frota | BrasilAviation.info</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --secondary: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 100%); 
            margin: 0; 
            padding: 10px;
            color: var(--text-main);
            min-height: 100vh;
        }

        .admin-container { max-width: 1000px; margin: 20px auto; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { 
            position: relative;
            padding: 12px 24px; border-radius: 10px; border: none; background: #cbd5e1; 
            font-weight: 700; cursor: pointer; color: var(--text-main); transition: 0.3s;
        }
        .tab-btn.active { background: var(--primary); color: white; }

        .badge-notif {
            position: absolute; top: -5px; right: -5px; background: var(--danger);
            color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 50%;
            border: 2px solid white;
        }
        .correction-card {
            background: white; border: 1px solid #e2e8f0; padding: 15px;
            border-radius: 12px; margin-bottom: 10px; display: flex;
            justify-content: space-between; align-items: center; transition: 0.2s;
        }
        .correction-card:hover { border-color: var(--primary); }
        .status-pill { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
        .status-pendente { background: #fef3c7; color: #92400e; }
        .status-concluido { background: #dcfce7; color: #166534; }
        .status-rejeitado { background: #fee2e2; color: #991b1b; }
        
        .modal-cor {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 10000; align-items: center; justify-content: center;
        }
        .modal-cor-content { background: white; padding: 30px; border-radius: 16px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }

        .card { 
            background: var(--card); 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); 
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.3);
            position: relative;
        }

        .card.is-foreign { border-top: 5px solid #000; }
        .foreign-badge {
            position: absolute; top: 15px; right: 15px; background: #000; color: #fff;
            padding: 5px 12px; border-radius: 20px; font-size: 0.65rem; font-weight: 800;
            display: none;
        }
        .card.is-foreign .foreign-badge { display: block; }

        h1 { font-size: 1.5rem; color: var(--primary); margin: 0; }
        h2 { margin-top: 0; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; color: var(--primary); border-bottom: 1px solid #eee; padding-bottom: 12px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .full { grid-column: 1 / -1; }

        .search-box { display: flex; gap: 10px; margin-bottom: 24px; background: var(--primary); padding: 20px; border-radius: 16px; }
        .search-box input { flex: 1; border: none; border-radius: 10px; padding: 14px; font-weight: 600; }

        label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 6px; color: var(--text-muted); text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; background: #fcfcfc; font-size: 0.95rem; font-family: inherit; }

        button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-save { background: var(--primary); color: white; width: 100%; margin-top: 10px; }
        .btn-search { background: white; color: var(--primary); }
        .btn-logout { background: var(--danger); color: white; padding: 8px 16px; font-size: 0.8rem; }
        .btn-delete { background: #fee2e2; color: var(--danger); border: 1px solid var(--danger); width: 100%; margin-top: 10px; }
        .btn-view-file { background: var(--primary-light); color: white; margin-top: 5px; font-size: 0.8rem; padding: 8px; }

        .list-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .list-table th, .list-table td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; }
        .list-table tr:hover { background: #f1f5f9; cursor: pointer; }
        .badge-id { background: #e2e8f0; padding: 4px 8px; border-radius: 6px; font-family: monospace; font-weight: bold; }

        .hidden { display: none !important; }

        .historico-section { background: #fff1f2; padding: 15px; border-radius: 12px; border-left: 5px solid var(--danger); margin-top: 15px; }
        .config-box { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #f1f5f9; padding: 15px; border-radius: 10px; }
        .checkbox-label { display: flex; flex-direction: row; align-items: center; gap: 5px; text-transform: none; font-size: 0.8rem; font-weight: 500; cursor: pointer; margin-top: 5px; }
        .checkbox-label input { width: auto; }

        .remark-tag { background: var(--primary); color: white; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; display: flex; align-items: center; gap: 10px; font-weight: 500; }
        .remark-tag i { cursor: pointer; color: #cbd5e1; transition: 0.2s; }
        .remark-tag i:hover { color: white; }
    </style>
</head>
<body>

<div id="loader-overlay" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;">
    <i class="fas fa-circle-notch fa-spin" style="font-size: 3rem; color: var(--primary);"></i>
    <p style="margin-top: 15px; font-weight: 700;">Processando...</p>
</div>

<div id="login-area">
    <div class="card" style="max-width: 350px; margin: 100px auto;">
        <div style="text-align:center; margin-bottom: 20px;">
            <i class="fas fa-plane-departure" style="font-size: 2.5rem; color: var(--primary);"></i>
            <h2 style="border:none; justify-content:center; margin-top:10px">Admin Login</h2>
        </div>
        <input type="email" id="email" placeholder="E-mail">
        <input type="password" id="pass" placeholder="Senha" style="margin-top:10px">
        <button class="btn-save" id="btn-login">Acessar Painel</button>
    </div>
</div>

<div id="admin-content" class="admin-container hidden">
    <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
        <div>
            <h1>BrasilAviation.info</h1>
            <small style="color: var(--text-muted)">Painel de Frota Dinâmico</small>
        </div>
        <button onclick="logout()" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Sair</button>
    </header>

    <div class="tabs">
        <button class="tab-btn active" id="tab-btn-gestao" onclick="switchTab('gestao')"><i class="fas fa-edit"></i> Gestão</button>
        <button class="tab-btn" id="tab-btn-operacoes" onclick="switchTab('operacoes')">
    <i class="fas fa-shuttle-van"></i> Entregas/RTS
</button>
        <button class="tab-btn" id="tab-btn-lista" onclick="switchTab('lista')"><i class="fas fa-list"></i> Lista de Matrículas</button>
        <button class="tab-btn" id="tab-btn-correcoes" onclick="switchTab('correcoes')">
            <i class="fas fa-tools"></i> Correções <span id="badge-correcoes" class="badge-notif hidden">0</span>
        </button>
    </div>

    <div id="tab-gestao">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Buscar por Matrícula, MSN ou ID">
            <button class="btn-search" onclick="buscarHibrido()"><i class="fas fa-search"></i> Buscar</button>
        </div>

        <div class="card" id="aero-card">
            <div class="foreign-badge">CIA ESTRANGEIRA / ANTIGA</div>
            <h2><i class="fas fa-plane"></i> Gestão de Aeronave</h2>
            <div class="form-grid">
                <div>
                    <label>ID Único (Fixo)</label>
                    <input type="text" id="aero-id" readonly placeholder="Automático" style="background:#f1f5f9; font-weight:bold; color:var(--primary)">
                </div>

                <div>
                    <label>Tipo de Operação</label>
                    <select id="aero-tipo-op" onchange="toggleCiaText()">
                        <option value="nacional">Brasileira (Atual)</option>
                        <option value="estrangeira">Estrangeira / Antiga</option>
                    </select>
                </div>

                <div id="box-cia-nacional">
                    <label>Companhia</label>
                    <select id="aero-cia">
                        <option value="Azul">Azul</option>
                        <option value="GOL">GOL</option>
                        <option value="LATAM Brasil">LATAM</option>
                        <option value="Sideral">Sideral</option>
                        <option value="Placar">Placar</option>
                        <option value="Avion Express Brasil">Avion Express Brasil</option>
                        <option value="Modern Logistics">Modern Logistics</option>
                        <option value="Total Linhas Aéreas">Total Linhas Aéreas</option>
                        <option value="Braspress">Braspress</option>
                        <option value="Levu">Levu</option>
                    </select>
                </div>
                
                <div id="box-subfrota">
    <label>Sub-Frota (Para o site)</label>
    <select id="aero-subfrota">
        <option value="Principal">Principal</option>
        <option value="Azul Logística">Azul Logística</option>
        <option value="Azul Conecta">Azul Conecta</option>
        <option value="GOLLOG">GOLLOG</option>
        <option value="LATAM Cargo">LATAM Cargo</option>
    </select>
</div>


                <div id="box-cia-estrangeira" class="hidden">
                    <label>Nome da Cia Estrangeira</label>
                    <input type="text" id="aero-cia-ext" placeholder="Ex: American Airlines">
                    <label class="checkbox-label"><input type="checkbox" id="aero-exibir-contexto"> Exibir "(estrang./antiga)" no site?</label>
                </div>

                <div><label>Matrícula *</label><input type="text" id="aero-reg" placeholder="Ex: PR-XMR" style="text-transform: uppercase;"></div>
                <div><label>MSN (Série) *</label><input type="text" id="aero-msn" placeholder="Ex: 60234" onblur="autoBuscaMSN()"></div>
                
                <div id="box-modelo"><label>Modelo da Aeronave *</label><select id="aero-mod" onchange="atualizarMotores()"></select></div>
                <div id="box-motores"><label>Motores</label><select id="aero-motores"><option value="">Selecione o Modelo</option></select></div>

<!-- Dentro da aba Gestão -->
<div id="box-status-container" class="full form-grid" style="grid-template-columns: 1fr 1fr; gap: 16px;">
    <div>
        <label>Status da Aeronave (Macro)</label>
        <select id="aero-status" onchange="toggleStatusHierarchy()">
            <option value="Ativa">Frota Atual (Ativa)</option>
            <option value="Futura">Aeronave Futura</option>
            <option value="Historico">Fora da Frota (Histórico)</option>
        </select>
    </div>

    <div id="sub-box-ativa">
        <label>Condição Operacional</label>
        <select id="aero-sub-status-ativa" onchange="toggleLocalEstocagem()">
            <option value="Em Operação">Em Operação (Normal)</option>
            <option value="Manutenção">Em Manutenção</option>
            <option value="Estocada">Estocada</option>
        </select>
    </div>

    <!-- Sub-Status para Histórico (Fica oculto se for Ativa) -->
    <div id="sub-box-historico" class="hidden">
        <label>Situação de Saída</label>
        <select id="aero-sub-status-hist" onchange="toggleLocalEstocagem()">
            <option value="Devolvido">Devolvido ao Lessor</option>
            <option value="Vendido">Vendido</option>
            <option value="SCR">Scrapped (Desmanchada)</option>
            <option value="Estocada">Estocada (Aguardando Destino)</option>
        </select>
    </div>

    <!-- Campo IATA - Essencial para o site saber ONDE o avião está -->
    <div id="box-local-iata" class="hidden">
        <label>Localização (IATA do Aeroporto)</label>
        <input type="text" id="aero-local-iata" placeholder="Ex: CNF, SJK, MIA" maxlength="3" style="text-transform: uppercase; font-weight: bold; color: var(--danger);">
    </div>
</div>

<!-- NOVO CAMPO: REGIME DE OPERAÇÃO (PROPRIEDADE) -->
<div class="full form-grid" style="grid-template-columns: 1fr; gap: 16px; margin-bottom: 10px;">
    <div>
        <label>Regime de Propriedade / Operação</label>
        <select id="aero-regime-prop" onchange="toggleRegimePropriedade()">
            <option value="Proprio">Próprio / Arrendamento Padrão</option>
            <option value="Dry Lease">Dry Lease (D-Lease)</option>
            <option value="Wet Lease">Wet Lease (W-Lease)</option>
        </select>
    </div>
</div>

<div id="box-regime-detalhes" class="full form-grid hidden" style="background: #f1f5f9; padding: 15px; border-radius: 12px; border-left: 5px solid var(--primary-light); grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
    <div>
        <label>Companhia Proprietária / Cedente</label>
        <select id="aero-regime-cia">
            <option value="">Selecione a Cia...</option>
            <option value="Azul">Azul</option>
            <option value="GOL">GOL</option>
            <option value="LATAM Brasil">LATAM</option>
            <option value="Sideral">Sideral</option>
            <option value="Placar">Placar</option>
            <option value="Avion Express Brasil">Avion Express Brasil</option>
            <option value="Modern Logistics">Modern Logistics</option>
            <option value="Total Linhas Aéreas">Total Linhas Aéreas</option>
            <option value="Braspress">Braspress</option>
            <option value="Levu">Levu</option>
            <option value="Euro Atlantic">Euro Atlantic</option>
            <option value="Outra Ext">Outra (Estrangeira)</option>
        </select>
    </div>
    <div>
        <label>Início do Contrato / Operação</label>
        <input type="month" id="aero-regime-data">
    </div>
    <div>
        <label>Estado da Pintura no Contrato</label>
        <select id="aero-regime-pintura-estado">
            <option value="Pintura Total do Operador">Pintura Total da Cia Atual</option>
            <option value="Pintura Híbrida">Pintura Híbrida</option>
            <option value="Pintura do Proprietário">Pintura do Proprietário / Cedente</option>
        </select>
    </div>
</div>


                <div class="full">
                    <label>Configuração de Uso</label>
                    <select id="aero-config-uso" onchange="toggleConfigAcentos()">
                        <option value="Passageiros">Passageiros</option>
                        <option value="Cargueiro">Cargueiro</option>
                        <option value="QC">QC (Quick Change)</option>
                        <option value="VIP">VIP</option>
                    </select>
                </div>

                <div class="full" id="sec-config">
                    <label id="label-acentos">Configuração de Assentos</label>
                    <div class="config-box">
                        <div><label>First</label><input type="number" id="conf-f" value="0"></div>
                        <div><label>Business</label><input type="number" id="conf-c" value="0"></div>
                        <div><label>Prem. Eco</label><input type="number" id="conf-w" value="0"></div>
                        <div><label>Economy</label><input type="number" id="conf-y" value="0"></div>
                    </div>
                </div>

                <div id="sec-datas" class="form-grid full">
                    <div>
                        <label>Mês/Ano de Fabricação</label>
                        <input type="month" id="aero-data-fab">
                        <label class="checkbox-label"><input type="checkbox" id="check-fab-pendente" onchange="togglePendentes()"> Não informado</label>
                    </div>
                    <div>
                        <label>Mês/Ano de Entrega</label>
                        <input type="month" id="aero-data-ent">
                        <label class="checkbox-label"><input type="checkbox" id="check-ent-pendente" onchange="togglePendentes()"> Não informado</label>
                    </div>
                </div>
                
                <div id="box-batismo"><label>Nome de Batismo</label><input type="text" id="aero-batismo"></div>

                <div class="full" id="box-remarks">
                    <label>Detalhes e Remarks (Interligado ao Glossário)</label>
                    <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                        <select id="remark-prefixo" style="flex: 1;">
                            <option value="">(NENHUMA)</option>
                            <option value="EST">EST - Estocado</option>
                            <option value="FOR">FOR - Fora de Uso</option>
                            <option value="DEV">DEV - Devolvido</option>
                            <option value="ACO">ACO - Acidentado</option>
                            <option value="PT">PT - Perda Total</option>
                            <option value="RTS">RTS - Retorno ao Serviço</option>
                            <option value="TRF">TRF - Transferido</option>
                            <option value="MAN">MAN - Manutenção</option>
                            <option value="EXP">EXP - Exportado</option>
                            <option value="ALF">ALF - Alfândega / Nacionalização</option>
                            <option value="PRC">PRC - Em Pintura</option>
                            <option value="HYB">HYB - Pintura Híbrida</option>
                            <option value="WHT">WHT - White (Todo Branco)</option>
                            <option value="STR">STR - Striped (Marcas Removidas)</option>
                            <option value="ICA">ICA - Intercâmbio de Aeronaves</option>
                            <option value="OPP">OPP - Operado por</option>
                            <option value="WTL">WTL - Wet lease</option>
                        </select>
                        <input type="text" id="remark-complemento" placeholder="Complemento (Ex: Webjet)..." style="flex: 2;">
                        <button type="button" onclick="addRemarkTag()" style="background: var(--primary); color: white;">+</button>
                    </div>
                    <div id="remark-tags-container" style="display: flex; flex-wrap: wrap; gap: 8px; min-height: 45px; padding: 12px; background: #f1f5f9; border-radius: 12px; border: 1px dashed #cbd5e1;"></div>
                </div>

                <div class="full" id="box-pintura">
                    <label>Tipo de Pintura</label>
                    <select id="aero-tipo-pintura" onchange="togglePintura()">
                        <option value="Padrão">Padrão</option>
                        <option value="Pintura Especial">Pintura Especial</option>
                        <option value="Adesivo">Adesivo</option>
                    </select>
                    <input type="text" id="aero-nome-pintura" class="hidden" placeholder="Nome da pintura" style="margin-top:8px;">
                </div>

                <div id="box-origem">
                    <label>Origem</label>
                    <select id="aero-origem" onchange="toggleOrigem()">
                        <option value="Novo">Novo de Fábrica</option>
                        <option value="Usado">Usado</option>
                    </select>
                </div>
                <div id="box-reg-antiga" class="hidden"><label>Matrícula Anterior</label><input type="text" id="aero-reg-antiga"></div>
                <div id="box-op-antigo" class="hidden full"><label>Operador Anterior</label><input type="text" id="aero-antigo-op"></div>

                <div id="secao-historico" class="full hidden historico-section">
                    <h3 style="margin-top:0; color:var(--danger); font-size: 0.9rem;">DETALHES DA SAÍDA</h3>
                    <div class="form-grid">
                        <div><label>Data de Saída</label><input type="date" id="hist-data-saida"></div>
                        <div><label>Situação</label><select id="hist-situacao"><option value="Devolvido">Devolvido ao Lessor</option><option value="Vendido">Vendido</option><option value="SCR">Scrapped</option></select></div>
                        <div class="full"><label>Destino Atual</label><input type="text" id="hist-destino-atual"></div>
                    </div>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 30px;">
                <button class="btn-save" style="background:var(--secondary);" onclick="salvarAero()"><i class="fas fa-save"></i> Salvar</button>
                <button class="btn-save" style="background:#64748b" onclick="limparForm()"><i class="fas fa-eraser"></i> Novo</button>
                <button class="btn-delete full hidden" id="btn-excluir-aero" onclick="excluirAero()"><i class="fas fa-trash-alt"></i> Excluir</button>
            </div>
        </div>
    </div>

    <div id="tab-lista" class="hidden">
        <div class="card">
            <h2>Lista de Matrículas</h2>
            <input type="text" id="list-search" placeholder="Filtrar por matrícula, cia..." onkeyup="filtrarTabela()">
            <div style="overflow-x: auto;">
                <table class="list-table">
                    <thead>
                        <tr><th>Reg</th><th>MSN</th><th>Modelo</th><th>Cia</th></tr>
                    </thead>
                    <tbody id="lista-corpo"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="tab-correcoes" class="hidden">
        <div class="card">
            <h2>Correções Pendentes</h2>
            <div id="lista-correcoes-container"></div>
        </div>
    </div>
</div>

<div id="tab-operacoes" class="hidden">
    <div class="card">
        <h2><i class="fas fa-shipping-fast"></i> Atualização de Status (Entregas / RTS)</h2>
        
        <!-- Pesquisa Manual -->
        <div style="display:flex; gap:10px; margin-bottom: 25px; background: #f1f5f9; padding: 15px; border-radius: 12px;">
            <input type="text" id="rts-search-input" placeholder="Digite a Matrícula (Ex: PR-XMR)" style="flex: 2; text-transform: uppercase;">
            <button onclick="verificarAeroRTS()" style="background:var(--primary); color:white; flex: 1;">
                <i class="fas fa-search"></i> Verificar
            </button>
        </div>

        <div style="overflow-x: auto; margin-top: 20px;">
            <table class="list-table">
                <thead>
                    <tr>
                        <th>Reg</th>
                        <th>Modelo</th>
                        <th>Status</th>
                        <th>Local</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="lista-operacoes-corpo"></tbody>
            </table>
        </div>

        <!-- PAINEL DE AÇÃO ÚNICO -->
        <div id="rts-action-panel" class="hidden" style="border-top: 2px solid #e2e8f0; padding-top: 20px; margin-top: 20px;">
            <div id="rts-aero-info" style="margin-bottom: 20px; padding: 10px; background: #dcfce7; border-radius: 8px; font-weight: 600;"></div>

            <div class="form-grid">
                <div id="rts-motivo-container">
                    <label>Ação / Novo Status</label>
                    <select id="rts-motivo-select">
                        <option value="Em Operação">Retorno ao Serviço (RTS)</option>
                        <option value="Manutenção">Entrada em Manutenção</option>

window.verificarAeroRTS = async () => {
    const termo = document.getElementById('rts-search-input').value.toUpperCase().trim();
    if(!termo) return alert("Digite uma matrícula ou ID válido.");

    document.getElementById('loader-overlay').classList.remove('hidden');
    const panel = document.getElementById('rts-action-panel');
    const info = document.getElementById('rts-aero-info');
    
    try {
        const qMatricula = query(collection(db, "aeronaves"), where("matricula", "==", termo));
        const snapMat = await getDocs(qMatricula);
        
        let resultados = [];
        snapMat.forEach(doc => resultados.push({id: doc.id, ...doc.data()}));

        if(resultados.length === 0) {
            alert("Nenhuma aeronave encontrada.");
            panel.classList.add('hidden');
            return;
        }

        let aero = resultados[0]; // Pega o primeiro encontrado

        // Guarda os dados originais no painel para não perdê-los
        panel.dataset.currentId = aero.id;
        panel.dataset.currentStatus = aero.status;
        panel.dataset.dataEntOriginal = aero.data_ent || ""; // SALVA A DATA ORIGINAL AQUI

        const isFutura = aero.status === "Futura";

        info.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span><b>${aero.matricula}</b> | ${aero.cia}</span>
                <span class="status-pill ${isFutura ? 'status-pendente' : 'status-rejeitado'}">
                    ${isFutura ? 'AERONAVE FUTURA' : 'JÁ NA FROTA (' + aero.sub_status + ')'}
                </span>
            </div>
        `;

        const btnAcao = document.getElementById('rts-btn-confirmar');
        const campoData = document.getElementById('rts-data-evento').parentElement;

        if (isFutura) {
            btnAcao.innerHTML = `<i class="fas fa-check"></i> EFETIVAR ENTREGA (NOVO AVIÃO)`;
            btnAcao.style.background = "var(--primary)";
            campoData.classList.remove('hidden'); // Precisa da data de entrega
        } else {
            btnAcao.innerHTML = `<i class="fas fa-play"></i> VOLTAR PARA A MALHA (MANTER DADOS)`;
            btnAcao.style.background = "var(--secondary)";
            campoData.classList.add('hidden'); // Não precisa mexer na data se já é da frota
        }

        panel.classList.remove('hidden');
        
        // AUTO-SCROLL: Faz a tela descer suavemente até o painel
        panel.scrollIntoView({ behavior: 'smooth' });

    } catch (e) {
        alert("Erro: " + e.message);
    } finally {
        document.getElementById('loader-overlay').classList.add('hidden');
    }
};

window.processarMudancaRTS = async () => {
    const panel = document.getElementById('rts-action-panel');
    const idDoc = panel.dataset.currentId;
    const statusAtual = panel.dataset.currentStatus;
    const dataOriginal = panel.dataset.dataEntOriginal;
    const dataDigitada = document.getElementById('rts-data-evento').value;

    document.getElementById('loader-overlay').classList.remove('hidden');

    try {
        const ref = doc(db, "aeronaves", idDoc);
        
        // Dados que SEMPRE mudam
        let updateData = { 
            status: "Ativa",
            sub_status: "Em Operação",
            local_iata: "", // Limpa o aeroporto de estocagem
            last_up: new Date().toISOString()
        };

        // LÓGICA DE DATA PROTEGIDA:
        if (statusAtual === "Futura") {
            // Se era futuro, precisamos definir a data de entrega agora
            if(!dataDigitada) {
                alert("Por favor, informe o mês de entrega para este novo avião.");
                document.getElementById('loader-overlay').classList.add('hidden');
                return;
            }
            updateData.data_ent = dataDigitada;
        } else {
            // SE JÁ ERA ATIVA: Não enviamos o campo data_ent no objeto updateData.
            // O Firebase vai manter o valor que já existe lá (ex: 2012) sem tocar nele.
            console.log("Mantendo data original: " + dataOriginal);
        }

        await updateDoc(ref, updateData);
        alert("Aeronave atualizada com sucesso!");
        
        panel.classList.add('hidden');
        document.getElementById('rts-search-input').value = "";
        if(window.carregarOperacoesRTS) carregarOperacoesRTS();

    } catch (e) {
        alert("Erro ao salvar: " + e.message);
    } finally {
        document.getElementById('loader-overlay').classList.add('hidden');
    }
};

window.buscarHibrido = async () => {
    const termo = document.getElementById('search-input').value.toUpperCase().trim();
    if(!termo) return;
    document.getElementById('loader-overlay').classList.remove('hidden');
    
    try {
        const queries = [
            query(collection(db, "aeronaves"), where("matricula", "==", termo)),
            query(collection(db, "aeronaves"), where("msn", "==", termo)),
            query(collection(db, "aeronaves"), where("id", "==", termo))
        ];

        const res = await Promise.all(queries.map(q => getDocs(q)));
        let documentosEncontrados = [];
        res.forEach(r => r.forEach(doc => {
            if (!documentosEncontrados.find(d => d.id === doc.id)) {
                documentosEncontrados.push({id: doc.id, ...doc.data()});
            }
        }));

        if(documentosEncontrados.length > 1) {
            let msg = "Múltiplas aeronaves encontradas:\n\n";
            documentosEncontrados.forEach((d, index) => {
                msg += `${index + 1} - ${d.matricula} (${d.cia}) - MSN: ${d.msn}\n`;
            });
            const escolha = prompt(msg + "\nDigite o número da aeronave desejada:");
            if(!escolha) return;
            const selecionada = documentosEncontrados[parseInt(escolha) - 1];
            if(selecionada) preencherCampos(selecionada);
        } else if (documentosEncontrados.length === 1) {
            preencherCampos(documentosEncontrados[0]);
        } else {
            alert("Nenhuma aeronave encontrada!");
        }
    } catch (error) {
        console.error("Erro na busca:", error);
        alert("Erro ao buscar: " + error.message);
    } finally {
        document.getElementById('loader-overlay').classList.add('hidden');
    }
};

function preencherCampos(d) {
    // ID e Identificação Básica
    document.getElementById('aero-id').value = d.id || "";
    document.getElementById('aero-reg').value = d.matricula || "";
    document.getElementById('aero-msn').value = d.msn || "";
            
    // Tipo de Operação
    const tipoOp = d.tipo_op || "nacional";
    document.getElementById('aero-tipo-op').value = tipoOp;
    toggleCiaText(); 

    if(tipoOp === 'estrangeira') {
        document.getElementById('aero-cia-ext').value = d.cia || "";
        document.getElementById('aero-exibir-contexto').checked = d.exibirContexto || false;
    } else {
        document.getElementById('aero-cia').value = d.cia || "Azul";
        document.getElementById('aero-subfrota').value = d.sub_frota || "Principal";
    }

    // Modelo e Motores
    document.getElementById('aero-mod').value = d.modelo || "";
    atualizarMotores(d.motores);

    // Status e Hierarquia
    document.getElementById('aero-status').value = d.status || "Ativa";
    toggleStatusHierarchy(); 
    
    if(d.status === "Ativa") document.getElementById('aero-sub-status-ativa').value = d.sub_status || "Em Operação";
    if(d.status === "Historico") document.getElementById('aero-sub-status-hist').value = d.sub_status || "Devolvido";
    
    toggleLocalEstocagem();
    document.getElementById('aero-local-iata').value = d.local_iata || "";

    // Configuração
    document.getElementById('aero-config-uso').value = d.config_uso || "Passageiros";
    toggleConfigAcentos();
    document.getElementById('conf-f').value = d.conf_f || 0;
    document.getElementById('conf-c').value = d.conf_c || 0;
    document.getElementById('conf-w').value = d.conf_w || 0;
    document.getElementById('conf-y').value = d.conf_y || 0;

    // Datas
    document.getElementById('check-fab-pendente').checked = (d.data_fab === "Pendente");
    document.getElementById('aero-data-fab').value = (d.data_fab !== "Pendente") ? (d.data_fab || "") : "";
    document.getElementById('check-ent-pendente').checked = (d.data_ent === "Pendente");
    document.getElementById('aero-data-ent').value = (d.data_ent !== "Pendente") ? (d.data_ent || "") : "";
    togglePendentes();

    // Histórico de Saída
    document.getElementById('hist-data-saida').value = d.hist_saida || "";
    document.getElementById('hist-situacao').value = d.hist_situacao || "Devolvido";
    document.getElementById('hist-destino-atual').value = d.hist_destino || "";

    // Estética
    document.getElementById('aero-batismo').value = d.batismo || "";
    document.getElementById('aero-tipo-pintura').value = d.tipo_pintura || "Padrão";
    document.getElementById('aero-nome-pintura').value = d.nome_pintura || "";
    togglePintura();

    // Origem
    document.getElementById('aero-origem').value = d.origem || "Novo";
    toggleOrigem();
    document.getElementById('aero-reg-antiga').value = d.reg_antiga || "";
    document.getElementById('aero-antigo-op').value = d.op_antigo || "";

    // Remarks
    currentRemarks = Array.isArray(d.remarks) ? d.remarks : [];
    renderRemarks();
    
        // Carrega dados do Regime de Propriedade
    document.getElementById('aero-regime-prop').value = d.regime_prop || "Proprio";
    toggleRegimePropriedade(); // Executa para abrir a caixinha caso seja Dry/Wet lease
    
    if(d.regime_prop === 'Dry Lease' || d.regime_prop === 'Wet Lease') {

async function carregarOperacoesRTS() {
    const corpo = document.getElementById('lista-operacoes-corpo');
    corpo.innerHTML = '<tr><td colspan="5" style="text-align:center"><i class="fas fa-spinner fa-spin"></i> Atualizando lista...</td></tr>';
    
    try {
        const q = query(collection(db, "aeronaves"), orderBy("matricula"));
        const snap = await getDocs(q);
        
        // Filtro para mostrar quem precisa de atenção no Painel de Operações
        const filtrados = snap.docs.filter(doc => {
            const d = doc.data();
            const isFutura = d.status === "Futura";
            // Mostra se for futura OU se estiver em manutenção/estocada para permitir o retorno (RTS)
            const isForaDeServico = (d.status === "Ativa" && (d.sub_status === "Estocada" || d.sub_status === "Manutenção"));
            return isFutura || isForaDeServico;
        });

        if(filtrados.length === 0) {
            corpo.innerHTML = "<tr><td colspan='5' style='text-align:center'>Nenhuma aeronave pendente de entrega ou RTS.</td></tr>";
            return;
        }

        corpo.innerHTML = filtrados.map(doc => {
            const d = doc.data();
            let labelStatus = d.status === "Futura" ? "FUTURA" : d.sub_status.toUpperCase();
            let corBadge = d.status === "Futura" ? "status-pendente" : "status-rejeitado";
            
            return `
                <tr>
                    <td><span class="badge-id">${d.matricula}</span></td>
                    <td>${d.modelo}</td>
                    <td><span class="status-pill ${corBadge}">${labelStatus}</span></td>
                    <td>${d.local_iata || '---'}</td>
                    <td>
                        <button onclick="prepararAcaoRTS('${doc.id}')" style="padding:5px 10px; background:var(--primary); color:white; font-size:0.7rem; border-radius:5px; cursor:pointer;">
                            <i class="fas fa-edit"></i> ATUALIZAR
                        </button>
                    </td>
                </tr>`;
        }).join('');
    } catch (e) { 
        console.error(e);
        corpo.innerHTML = "<tr><td colspan='5'>Erro ao carregar dados.</td></tr>";
    }
}

window.renderTabela = (dadosManuais = null) => {
    // 1. Base de dados (Filtra por Subfrota e Status)
    let base = dadosManuais || frotaRaw.filter(a => {
        const isSub = (subFiltro === 'Principal') ? (!a.sub_frota || a.sub_frota === 'Principal') : (a.sub_frota === subFiltro);
        return isSub && a.status === statusFiltro;
    });

    // 2. Lógica de Famílias e Variantes
    const familias = {}; 
    base.forEach(a => {
        if(a.modelo) {
            let partes = a.modelo.split(' ');
            let familia = partes[0] + (partes[1] ? ' ' + partes[1] : ''); // Ex: "Boeing 737" ou "Airbus A320"
            
            if(!familias[familia]) familias[familia] = { total: 0, variantes: {} };
            familias[familia].total++;
            
            let varNome = a.modelo; // Ex: "Boeing 737-800"
            familias[familia].variantes[varNome] = (familias[familia].variantes[varNome] || 0) + 1;
        }
    });

    // 3. Renderiza os Cards de Categoria (Stats Grid)
    let htmlStats = `<div class="stat-card ${modeloFiltro === 'Todos' ? 'active-filter' : ''}" onclick="filtrarModelo('Todos')">
        <b>${base.length}</b><span>TOTAL</span></div>`;

    Object.keys(familias).sort().forEach(f => {
        htmlStats += `<div class="stat-card ${modeloFiltro === f ? 'active-filter' : ''}" onclick="filtrarModelo('${f}')">
            <b>${familias[f].total}</b><span>${f}</span></div>`;
    });
    document.getElementById('stats-grid').innerHTML = htmlStats;

    // 4. Se uma família estiver selecionada, mostra as VARIANTES abaixo
    let htmlVariantes = "";
    if (modeloFiltro !== 'Todos' && modeloFiltro !== 'Especiais' && familias[modeloFiltro]) {
        htmlVariantes = `<div style="display:flex; gap:10px; justify-content:center; margin-bottom:20px; flex-wrap:wrap; width:100%;">`;
        Object.keys(familias[modeloFiltro].variantes).sort().forEach(v => {
            const isActive = modeloRealFiltro === v;
            htmlVariantes += `
                <button onclick="filtrarVariante('${v}')" 
                    style="padding:8px 15px; border-radius:20px; border:1px solid var(--cor-hero-1); 
                    background:${isActive ? 'var(--cor-hero-1)' : 'transparent'}; 
                    color:${isActive ? 'white' : 'var(--cor-hero-1)'}; font-weight:700; cursor:pointer; font-size:0.8rem;">
                    ${v} (${familias[modeloFiltro].variantes[v]})
                </button>`;
        });
        htmlVariantes += `</div>`;
    }
    
    // Insere as variantes antes da tabela (opcional: pode criar uma div específica no HTML para isso)
    const statsContainer = document.getElementById('stats-grid');
    const existingVariantes = document.getElementById('variantes-container');
    if (existingVariantes) existingVariantes.remove();
    
    if (htmlVariantes) {
        const divVar = document.createElement('div');
        divVar.id = 'variantes-container';
        divVar.innerHTML = htmlVariantes;
        statsContainer.parentNode.insertBefore(divVar, statsContainer.nextSibling);
    }

    // 5. Filtragem Final da Lista para a Tabela
    let listaFiltrada = base;
    if (modeloFiltro !== 'Todos' && modeloFiltro !== 'Especiais') {
        listaFiltrada = base.filter(a => a.modelo.startsWith(modeloFiltro));
        if (modeloRealFiltro) {
            listaFiltrada = listaFiltrada.filter(a => a.modelo === modeloRealFiltro);
        }
    }

    // 6. Ordenação e Paginação
    const listaOrdenada = listaFiltrada.sort((a, b) => (a.modelo || "").localeCompare(b.modelo || "") || (a.matricula || "").localeCompare(b.matricula || ""));
    const totalItens = listaOrdenada.length;
    const totalPaginas = Math.ceil(totalItens / itensPorPagina) || 1;
    if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
    const listaPaginada = listaOrdenada.slice((paginaAtual - 1) * itensPorPagina, paginaAtual * itensPorPagina);

    // 7. Atualiza UI de Paginação
    document.getElementById('current-page').innerText = paginaAtual;
    document.getElementById('total-pages').innerText = totalPaginas;
    document.getElementById('pagination-controls').style.display = totalItens > itensPorPagina ? 'flex' : 'none';

    // 8. Renderiza Linhas da Tabela
    document.getElementById('corpo-tabela').innerHTML = listaPaginada.map(a => `
        <tr onclick="location.href='aeronave.html?msn=${a.msn}'" style="cursor:pointer">
            <td><b style="color:var(--cor-hero-1)">${a.matricula}</b></td>
            <td style="font-family:monospace; font-size:0.8rem">${a.msn}</td>
            <td><span class="badge-model">${a.modelo}</span></td>
            <td style="font-size:0.8rem">${formatarData(statusFiltro === 'Historico' ? a.hist_saida : a.data_ent)}</td>
            <td>
                ${a.batismo ? `<i style="display:block; font-size:0.75rem; color:var(--cor-hero-1)">"${a.batismo}"</i>` : ''}
                ${a.tipo_pintura && a.tipo_pintura !== "Padrão" ? `<span class="remark-tag-mini" style="background:${a.status === 'Ativa' ? 'var(--cor-hero-1)' : '#666'}; color:white;">${a.nome_pintura || a.tipo_pintura}</span>` : ''}
                ${(a.remarks || []).map(r => `<span class="remark-tag-mini">${r.prefixo}</span>`).join('')}
            </td>
        </tr>`).join('') || '<tr><td colspan="5" style="text-align:center; padding:30px">Nenhuma aeronave encontrada.</td></tr>';

    // Sincroniza abas
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if(document.getElementById(`btn-${statusFiltro}`)) document.getElementById(`btn-${statusFiltro}`).classList.add('active');
};
</script>
</body>
</html>
